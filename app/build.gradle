plugins {
    id 'com.android.application'
}

// ---- Build number, shown in About ----
// build-number.properties holds the number of the last SUCCESSFUL build. A real build (assemble / install /
// bundle / Run) is compiled as that number + 1, and the file is only updated once the build has succeeded,
// so failed or cancelled builds don't use up numbers and each successful build gets exactly one number.
// Started from an estimate of ~220 earlier builds (63 commits, Nov 11-20 2026, several test builds each).
def buildNumberFile = file('build-number.properties')
def readLastBuildNumber = {
    def p = new Properties()
    if (buildNumberFile.exists()) {
        buildNumberFile.withInputStream { p.load(it) }
    }
    (p.getProperty('BUILD_NUMBER') ?: '220') as int
}
int lastBuildNumber = readLastBuildNumber()
// Count only actual builds, not Android Studio project syncs.
boolean isRealBuild = gradle.startParameter.taskNames.any { it =~ /(?i)(assemble|install|bundle)/ }
int buildNumber = isRealBuild ? lastBuildNumber + 1 : lastBuildNumber
// The release you choose; the build number is added as a 4th part (versionName 2.1.0.436).
def releaseVersion = '2.1.0'
def buildDate = java.time.LocalDate.now().format(java.time.format.DateTimeFormatter.ofPattern('dd.MM.yyyy'))

if (isRealBuild) {
    // Save the number only after the APK/bundle was produced. Several of these tasks can run in one build
    // (e.g. assembleDebug + installDebug): the "only if higher" check makes that a single increment.
    tasks.matching { it.name ==~ /(assemble|install|bundle)[A-Za-z]*/ }.configureEach { t ->
        t.doLast {
            if (readLastBuildNumber() < buildNumber) {
                def p = new Properties()
                p.setProperty('BUILD_NUMBER', buildNumber.toString())
                buildNumberFile.withOutputStream {
                    p.store(it, 'Number of the last successful build. Updated automatically; do not edit by hand.')
                }
                logger.lifecycle("Build number: ${buildNumber}")
            }
        }
    }
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.phinmadvader.andcpp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phinmadvader.andcpp'
        minSdk 16 // TLS 1.2 for secure hubs (NMDCS/ADCS) needs Android 4.1+
        targetSdk 28
        versionCode buildNumber // = build number, so the in-app updater can compare builds
        // Release number = release (set here) + build number, e.g. 2.1.0.436: goes up with every build.
        versionName "${releaseVersion}.${buildNumber}"

        buildConfigField 'int', 'BUILD_NUMBER', "${buildNumber}"
        buildConfigField 'String', 'BUILD_DATE', "\"${buildDate}\""
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    // JVM unit tests: android.* calls (e.g. Log) return defaults instead of throwing "not mocked".
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'

    testImplementation 'junit:junit:4.13.2'
}
